server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: olcys-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/olcys}
    username: ${SPRING_DATASOURCE_USERNAME:olcys}
    password: ${SPRING_DATASOURCE_PASSWORD:olcys_dev_password}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

olcys:
  ai:
    provider: ${OLCYS_AI_PROVIDER:local-rules}
    base-url: ${OLCYS_AI_BASE_URL:http://localhost:11434/v1}
    model: ${OLCYS_AI_MODEL:llama3.2:latest}
    allow-external: ${OLCYS_AI_ALLOW_EXTERNAL:false}
    timeout-seconds: ${OLCYS_AI_TIMEOUT_SECONDS:45}
  connectors:
    timeout-seconds: 5
